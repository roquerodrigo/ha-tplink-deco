name: Update PR Branch

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update release-please PR
    runs-on: ubuntu-latest
    steps:
      - name: Update open release-please PR branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.RELEASE_PLEASE_PAT }}
          script: |
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:release-please--branches--main--components--ha-tplink-deco`,
            });
            for (const pr of pulls) {
              core.info(`Updating PR #${pr.number} branch`);
              await github.rest.pulls.updateBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
              });
            }
